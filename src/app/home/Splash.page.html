<ion-content [fullscreen]="true" class="home-background splash-content">
  <main class="welcome splash-screen">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <header class="brand">
      <div class="brand-icon-wrap">
        <ion-icon class="room-icon" name="location" aria-hidden="true"></ion-icon>
      </div>
      <h1>Room <span class="finder-word">Finder</span></h1>
    </header>

    <section class="welcome-content">
      <p class="location-label">NEUST PAPAYA OFF CAMPUS</p>
      <h2>Find Your Room, Find Your Way.</h2>
    </section>

    <ion-button class="start-button" expand="block" (click)="openDashboard()">Get Started</ion-button>
  </main>
</ion-content>
